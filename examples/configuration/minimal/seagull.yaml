# ============================================================================ #
#                            Minimal config example                            #
# ============================================================================ #
# The smallest config that passes validation: one contract, one generator,     #
# every optional field left at its default. Everything left out here (paths,   #
# specFormat, per-artifact overrides, custom README templates, ...) is         #
# covered in ../multiservice/seagull.yaml instead.                             #
# ============================================================================ #

configVersion: 1

# ============================================================================ #
# Free-form tree of values used for template interpolation elsewhere in this   #
# file (generator naming, additionalProperties, ...). Nest however you like -  #
# every leaf is addressable as `{vars.<dot.path>}`.                            #
# ============================================================================ #
vars:
  repository:
    owner: "your-org"
    repo: "your-contracts-repo"

# ============================================================================ #
#  Publishing - git branch/tag naming and registry URLs for every artifact,    #
#  unless overridden per-generator (`generators.<id>.publishing`) or           #
#  per-contract-artifact (`artifacts[].overrides.publishing`).                 #
# ============================================================================ #
publishing:
  branch: "sdk/svc-{service}/{id}"
  tag: "svc-{service}-{id}-v{version}"
  repositoryUrl: "https://github.com/{vars.repository.owner}/{vars.repository.repo}"

  npm:
    registry: "https://registry.npmjs.org"
    access: "public"

  maven:
    repositoryId: "github"
    repositoryUrl: "https://maven.pkg.github.com/{vars.repository.owner}/{vars.repository.repo}"

# ============================================================================ #
# Documentation - server host/port and metadata for the generated docs site.   #
# ============================================================================ #
docs:
  server:
    host: "localhost"
    port: 8080

  metadata:
    title: "Your API Docs"
    description: "Generated API documentation"
    favicon: "/favicon.ico"
    baseServerUrl: "https://api.example.com"

# ============================================================================ #
#  Generators - reusable "recipes": a tool + how to invoke it. Contracts pick  #
#  which of these to run, by id, under their own `artifacts:` list below.      #
# ============================================================================ #
generators:
  ts-client:
    tool: "openapi-generator"
    generator: "typescript-fetch"
    lang: "typescript"
    kind: "client"
    package: "@your-org/{service}-client"

# ============================================================================ #
#  Contracts - one per service. `artifacts` picks which generators (above)     #
#  run for that service, by id. Different services may list different          #
#  generators entirely (e.g. a service-specific `java-client-legacy` recipe)   #
#  - just add it under `generators:` and reference it here.                    #
# ============================================================================ #
contracts:
  - name: "auth"
    title: "Auth Service API"
    entrypoint: "specs/auth/openapi.yaml"
    artifacts:
      - "ts-client"
