# ============================================================================ #
#                          Redocly Configuration File                          #
# ============================================================================ #
# Hand-authored half of 'redocly.yaml'. The 'apis:' section is generated by    #
# Seagull's 'syncRedoclyConfig' (runs automatically before lint / bundle /     #
# generate) and merged with this file's `extends`/`rules` to produce the final #
# 'redocly.yaml'.                                                              #
# ============================================================================ #

extends:
  - "recommended"

rules:
  operation-operationId: "error"
  no-unused-components: "error"
  path-params-defined: "error"
