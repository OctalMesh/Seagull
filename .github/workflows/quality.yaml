# ============================================================================ #
#                               Quality Workflow                               #
# ============================================================================ #
# Runs typecheck, ESLint, and Prettier format checks on every push to dev and  #
# release, and on every pull request targeting either branch.                  #
#                                                                              #
# Skip tags (anywhere in commit message or PR title):                          #
#   [ci-skip]      - skips all workflows                                       #
#   [quality-skip] - skips this workflow only                                  #
# ============================================================================ #

name: "Quality"

on:
  workflow_dispatch:
  push:
    branches: ["dev", "release"]
    paths:
      - "src/**"
      - "packages/*/src/**"
      - "e2e/**"
      - "package.json"
      - "packages/*/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "packages/*/tsconfig*.json"
      - "*.config.*"
      - "packages/*/*.config.*"
      - ".prettierrc*"
      - ".prettierignore"
  pull_request:
    branches: ["dev", "release"]

concurrency:
  group: "quality-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: "read"

jobs:
  # Check if the commit message / PR title contains skip tags
  check:
    name: "Skip Check"
    runs-on: "ubuntu-latest"
    outputs:
      should_skip: ${{ steps.belay.outputs.issued }}

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: "Run: Check skip tags"
        id: "belay"
        uses: OctalMesh/belay-action@v1
        with:
          signal_tags: "[ci-skip],[quality-skip]"

  # Perform quality analysis
  quality:
    name: "Analyze"
    needs: "check"
    if: needs.check.outputs.should_skip != 'true'
    runs-on: "ubuntu-latest"
    timeout-minutes: 15

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Setup: pnpm"
        uses: pnpm/action-setup@v6

      - name: "Setup: Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: "Setup: Install dependencies"
        run: "pnpm install --frozen-lockfile"

      - name: "Setup: Build"
        run: "pnpm run build"

      - name: "Run: Typecheck"
        run: "pnpm run typecheck"

      - name: "Run: ESLint"
        run: "pnpm run lint"

      - name: "Run: Prettier format check"
        run: "pnpm run format:check"
