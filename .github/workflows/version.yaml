# ============================================================================ #
#                           Version Packages Workflow                          #
# ============================================================================ #
# Keeps a "Version Packages" PR up to date whenever changesets land on dev,    #
# merging that PR bumps every package's version and updates CHANGELOG.md.      #
#                                                                              #
# See: https://changesets.dev                                                  #
# ============================================================================ #

name: "Version Packages"

on:
  push:
    branches: ["dev"]

concurrency: "${{ github.workflow }}-${{ github.ref }}"

permissions:
  contents: "read"

jobs:
  version:
    name: "Version"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "write"
      pull-requests: "write"

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Setup: pnpm"
        uses: pnpm/action-setup@v6

      - name: "Setup: Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: "Setup: Install dependencies"
        run: "pnpm install --frozen-lockfile"

      - name: "Run: Version Packages"
        uses: changesets/action@v2
        with:
          version-script: "pnpm run version"
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
