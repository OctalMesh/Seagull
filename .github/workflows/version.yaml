# ============================================================================ #
#                           Version Packages Workflow                          #
# ============================================================================ #
# Keeps a single "Version Packages" PR up to date whenever changesets land on  #
# dev: it takes dev's current HEAD, bumps every package's version + updates    #
# CHANGELOG.md on top of it, and opens that straight against release (not      #
# dev) - so merging this one PR both bumps the version and promotes dev's      #
# accumulated changes to release in one step. release-readiness.yaml,          #
# quality.yaml, test.yaml, and codeql.yaml all still run against it as a       #
# normal PR into release.                                                      #
#                                                                              #
# Secrets:                                                                     #
#   - GITHUB_TOKEN: Used to authenticate the actions that bump versions and    #
#                   open PRs. This token is automatically provided by GitHub   #
#                   Actions.                                                   #
#   - SYNC_PAT:     Personal Access Token with contents and PR access, used to #
#                   open the dev -> release PR.                                #
#                                                                              #
# See: https://changesets.dev                                                  #
# ============================================================================ #

name: "Releasing: Version"

on:
  push:
    branches: ["dev"]

concurrency: "${{ github.workflow }}-${{ github.ref }}"

permissions:
  contents: "read"

jobs:
  version:
    name: "Version"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10

    permissions:
      contents: "write"
      pull-requests: "write"

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Setup: pnpm"
        uses: pnpm/action-setup@v6

      - name: "Setup: Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: "Setup: Install dependencies"
        run: "pnpm install --frozen-lockfile"

      - name: "Run: Version Packages"
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          version-script: "pnpm run version"
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          pr-base-branch: "release"
