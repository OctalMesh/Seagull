# ============================================================================ #
#                               Publish Workflow                               #
# ============================================================================ #
# Publishes all workspace packages to npm whenever a GitHub Release is         #
# published.                                                                   #
#                                                                              #
# post-release.yaml prepares a DRAFT release with the tag and changelog        #
# already filled in as soon as a version lands on release - clicking "Publish" #
# on that draft is the one deliberate, human-triggered action left in the      #
# whole pipeline, and it's what fires this workflow.                           #
#                                                                              #
# See: RELEASING.md - for more details on the release process.                 #
# ============================================================================ #

name: "Publish"

on:
  release:
    types: ["published"]

permissions:
  contents: "read"

jobs:
  publish:
    name: "Publish to npm"
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: "Setup: pnpm"
        uses: pnpm/action-setup@v6

      - name: "Setup: Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: "Setup: Install dependencies"
        run: "pnpm install --frozen-lockfile"

      - name: "Run: Build"
        run: "pnpm run build"

      - name: "Run: Typecheck"
        run: "pnpm run typecheck"

      - name: "Run: Test suite"
        run: "pnpm run test:run"

      - name: "Run: Verify release tag matches package version"
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package.json version '$PKG_VERSION'."
            echo "::error::Make sure post-release.yaml's Tag & Draft Release job tagged the right commit."
            exit 1
          fi

      - name: "Run: Publish to npm"
        run: "pnpm run release:publish"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
