# ============================================================================ #
#                          Release Readiness Workflow                          #
# ============================================================================ #
# Gates pull requests targeting release. quality.yaml and test.yaml already    #
# run their checks against release as a PR-target branch, so this workflow     #
# adds only what they don't cover: proof that the version actually moved       #
# forward. The "Version Packages" PR is created directly against `release`     #
# from the current `dev` state.                                                #
#                                                                              #
# See: RELEASING.md - for more details on the release process.                 #
# ============================================================================ #

name: "Releasing: Readiness"

on:
  workflow_dispatch:
  pull_request:
    branches: ["release"]

concurrency:
  group: "release-readiness-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: "read"

jobs:
  version-gate:
    name: "Version Gate"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: "Setup: Fetch release branch"
        run: "git fetch origin release"

      - name: "Run: Compare version against release"
        run: |
          PR_VERSION=$(node -p "require('./package.json').version")
          git show origin/release:package.json > /tmp/release-package.json
          RELEASE_VERSION=$(node -p "require('/tmp/release-package.json').version")

          echo "PR version:      $PR_VERSION"
          echo "release version: $RELEASE_VERSION"

          if ! npx --yes semver "$PR_VERSION" -r ">${RELEASE_VERSION}" >/dev/null; then
            echo "::error::Package version ($PR_VERSION) is not greater than the version already on release ($RELEASE_VERSION)."
            echo "::error::The PR head must contain a SemVer version newer than release; the normal path is the Version Packages PR maintained by version.yaml from dev."
            exit 1
          fi
